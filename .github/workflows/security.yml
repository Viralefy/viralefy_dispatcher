name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Scheduled cargo audit — RustSec advisories aparecem entre PRs.
    # Renovate cuida do bump; aqui apenas reportamos o estado atual.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    # Non-blocking: complementa Renovate vulnerabilityAlerts. Promover
    # pra blocking quando baseline estiver zerado.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A gitleaks-action@v2 exige licença paga para organizações e falhava com
      # "missing gitleaks license". O binário oficial é o mesmo scanner, sem licença.
      - name: gitleaks (binário oficial, histórico completo)
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

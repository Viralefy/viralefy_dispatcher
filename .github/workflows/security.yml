name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Scheduled cargo audit — RustSec advisories aparecem entre PRs.
    # Renovate cuida do bump; aqui apenas reportamos o estado atual.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    # Non-blocking: complementa Renovate vulnerabilityAlerts. Promover
    # pra blocking quando baseline estiver zerado.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "viralefy_api"
version = "0.1.0"
edition = "2021"
description = "Viralefy API dispatcher — security-focused reverse proxy em Rust (Phase 9)"
license = "Proprietary"

[[bin]]
name = "viralefy-api"
path = "src/main.rs"

[dependencies]
# Web framework + runtime
axum = { version = "0.7", features = ["macros", "tracing"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "request-id", "util"] }

# Rate limiting
tower_governor = "0.5"

# HTTP client pra reverse proxy interno
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging + tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# JWT verify (mint fica no viralefy_auth)
jsonwebtoken = "9"

# Error handling
anyhow = "1"
thiserror = "2"

# Input sanitization
ammonia = "4"
regex = "1"

# Postgres (read-only — hot-set de revogação)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono"] }

# Misc
once_cell = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"

# Metrics — exposição Prometheus do próprio dispatcher (não proxiar /metrics
# pro core era o motivo do "p95 do dispatcher" aparecer idêntico ao do core
# no Grafana). Métricas medidas no middleware antes de qualquer proxy.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Atomic swap pro hot-set — leitor-zero-lock reduz cauda do p95.
arc-swap = "1"

[dev-dependencies]
mockito = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
